# rmx-server-app (github.com/rmx-lt/rmx-server-app): the app and its database.
# See wiki Server-Infra §10 "App". Always on: no profile.
#
# Variables come from app/.env (server only, gitignored; template
# .env.example), read automatically for this included file: the passwords,
# and APP_TAG=sha-xxxxxxx, the deployed image, rewritten by the deploy
# script. No ${VAR:?} checks: they would break `docker compose` for the
# whole stack (Caddy, Mosquitto) whenever the file is missing.
# No ports are published: Caddy reaches app over rmx_edge,
# and only app reaches db over rmx_backend.
# Never `docker compose stop|down` without service names (that also stops
# Caddy and Mosquitto); stop `app` and `db` only when the owner asks.

services:
  db:
    image: timescale/timescaledb:2.30.2-pg17
    restart: unless-stopped
    mem_limit: 256m
    shm_size: 64m
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      # Skip timescaledb-tune at first start; the settings are below.
      NO_TS_TUNE: "true"
    # Tuned for the 1 GB VPS: small buffers, few connections and workers.
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=20
      - -c
      - max_worker_processes=6
      - -c
      - max_parallel_workers=0
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - autovacuum_max_workers=2
      - -c
      - timescaledb.max_background_workers=3
      - -c
      - timescaledb.telemetry_level=off
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: ghcr.io/rmx-lt/rmx-server-app:${APP_TAG}
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:${APP_DB_PASSWORD}@db:5432/app
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USERNAME: app
      MQTT_PASSWORD: ${APP_MQTT_PASSWORD}
      # Pages that may log in, change data and open the WebSocket (the app's
      # CSRF check). Required since the app has its own login.
      ALLOWED_ORIGINS: https://api.rmx.lt
      LOG_LEVEL: info
      # Signed gateway images (<version>.bin), sent over MQTT. Empty would
      # mean the app does not answer firmware requests.
      FIRMWARE_DIR: /firmware
    volumes:
      # Relative to this file: services/app/firmware. Read-only.
      # The app runs as uid 65532, so those files must be world-readable.
      - ./firmware:/firmware:ro
    # Same check as the image's HEALTHCHECK (GET /app/health), but more
    # often, so the deploy script sees "healthy" within seconds.
    healthcheck:
      test: ["CMD", "/app/rmx-server", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - edge
      - backend

networks:
  edge:
    name: rmx_edge
  backend:
    name: rmx_backend
    internal: true
