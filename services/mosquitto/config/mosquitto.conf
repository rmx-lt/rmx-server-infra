# Mosquitto 2.1 config for mqtt.rmx.lt. See wiki Server-Infra §10 "Mosquitto".
# Reload after editing (no disconnects): docker compose kill -s HUP mosquitto

# --- Logins and access rules (shared by all listeners) -----------------
allow_anonymous false
password_file /mosquitto/auth/passwd
# A copy of config/acl from this repo, installed with owner 1883 and mode
# 0600 (Mosquitto refuses world-readable files in future versions):
#   sudo install -o 1883 -g 1883 -m 0600 config/acl data/auth/acl
acl_file /mosquitto/auth/acl

# --- Storage and logs ---------------------------------------------------
persistence true
persistence_location /mosquitto/data/
autosave_interval 300
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- Public listener: MQTT over TLS (mowers, PC tools) ------------------
listener 8883
protocol mqtt
# Let's Encrypt cert from Caddy (full chain) and its key, see cert-sync/
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
# Minimum TLS version: 1.2 (1.3 is allowed too)
tls_version tlsv1.2
# The client ID is forced to the username, so one device can't kick
# another off by connecting with the same client ID.
use_username_as_clientid true

# --- Internal listener: plain MQTT for the app container ----------------
# Not published in compose.yaml, so not reachable from the internet.
listener 1883
protocol mqtt

# No WebSocket listener: browsers don't speak MQTT (they use the app's own
# WebSocket). Password logins use 8883, device certificates use 8884, and
# the app uses 1883.
#
# 8884 is not in this file. Ansible writes device-listener/8884.conf only
# when config/device-ca/root.pem and crl.pem both exist (public files, no
# placeholder). An empty directory leaves Mosquitto on 8883 and 1883.
include_dir /mosquitto/config/device-listener
