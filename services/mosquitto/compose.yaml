# Mosquitto: MQTT broker for the mowers.
# Public ports 8883 (MQTT over TLS, password logins) and 8884 (MQTT over TLS,
# device client certificates). Port 1883 (plain MQTT) is NOT published:
# it is only reachable from containers on the rmx_edge network (the app).

services:
  mosquitto:
    image: eclipse-mosquitto:2.1-alpine
    restart: unless-stopped
    # The broker itself needs a few MB; the cap protects the 1 GB VPS.
    mem_limit: 64m
    ports:
      - "8883:8883"
      # Published even before the device CA exists: nothing listens behind it
      # until Ansible writes config/device-listener/8884.conf. A changed port
      # list recreates the container (docker compose up -d), HUP does not.
      - "8884:8884"
    volumes:
      # The whole config directory, not the conf file alone. A file bind mount
      # keeps the inode from container start, so a later git checkout of
      # mosquitto.conf stays invisible and SIGHUP re-reads the old file.
      # config/acl is in this directory too; Mosquitto does not use it (it
      # reads the installed copy under data/auth).
      - ./config:/mosquitto/config:ro
      # Server only (gitignored):
      #   data/auth/passwd  - logins (hashed), owner 1883, mode 0600
      #   data/auth/acl     - installed copy of config/acl, owner 1883, mode 0600
      #   data/certs/       - TLS cert + key, copied from Caddy by cert-sync
      #   data/store/       - persistence (retained messages, sessions)
      - ./data/auth:/mosquitto/auth
      - ./data/certs:/mosquitto/certs:ro
      - ./data/store:/mosquitto/data
    networks:
      - edge

networks:
  edge:
    name: rmx_edge
