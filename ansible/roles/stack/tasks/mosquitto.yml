# Mosquitto's server-only files (wiki Server-Infra §10 "Mosquitto"): logins, the
# installed ACL, folders for the certificate and persistence. Mosquitto runs
# as uid 1883 inside the container.

- name: Mosquitto folders
  ansible.builtin.file:
    path: "{{ services_dir }}/mosquitto/data/{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "", owner: root, mode: "0755" }
    - { path: auth, owner: "1883", mode: "0750" }
    - { path: certs, owner: "1883", mode: "0750" }
    - { path: store, owner: "1883", mode: "0700" }

# Mosquitto reads a copy it owns (it warns about world-readable ACL files).
- name: ACL (installed copy of config/acl)
  ansible.builtin.copy:
    src: "{{ services_dir }}/mosquitto/config/acl"
    remote_src: true
    dest: "{{ services_dir }}/mosquitto/data/auth/acl"
    owner: "1883"
    group: "1883"
    mode: "0600"
  notify: Reload mosquitto

# The broker reads this file from the config directory mount. A checksum stamp
# (server only, not the file Mosquitto reads) is what tells the play the
# content changed, so the reload handler runs. The stamp stays out of the
# mounted auth/certs/store directories.
- name: Hash of mosquitto.conf
  ansible.builtin.stat:
    path: "{{ services_dir }}/mosquitto/config/mosquitto.conf"
    checksum_algorithm: sha1
  register: mosquitto_conf

- name: Mosquitto config reload stamp
  ansible.builtin.copy:
    dest: "{{ services_dir }}/mosquitto/data/.mosquitto.conf.sha1"
    content: "{{ mosquitto_conf.stat.checksum }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Reload mosquitto

# Public device CA files (wiki Device-CA). No placeholders: the listener
# exists only when both files are in the checkout. A CRL change reloads
# with SIGHUP. Creating or deleting 8884.conf restarts, because a reload
# does not bind a new port.
- name: Device CA certificate and CRL
  ansible.builtin.stat:
    path: "{{ services_dir }}/mosquitto/config/device-ca/{{ item }}"
    checksum_algorithm: sha1
  loop:
    - root.pem
    - crl.pem
  register: device_ca_files

- name: Device CA files are readable
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    mode: "0644"
  loop: "{{ device_ca_files.results }}"
  when: item.stat.exists | default(false)
  loop_control:
    label: "{{ item.item }}"

- name: Device certificate listener
  ansible.builtin.copy:
    dest: "{{ services_dir }}/mosquitto/config/device-listener/8884.conf"
    # Same owner as the rest of the repo checkout: the "Repo files owned by
    # the admin user" task chowns everything else, and root here made run 2 differ.
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
    content: |
      # Written by Ansible when device-ca/root.pem and crl.pem both exist.
      listener 8884
      protocol mqtt
      certfile /mosquitto/certs/fullchain.pem
      keyfile /mosquitto/certs/privkey.pem
      cafile /mosquitto/config/device-ca/root.pem
      crlfile /mosquitto/config/device-ca/crl.pem
      require_certificate true
      use_identity_as_username true
      use_username_as_clientid true
      tls_version tlsv1.2
  when: device_ca_files.results | selectattr('stat.exists') | list | length == 2
  notify: Restart mosquitto

- name: No device certificate listener without the CA files
  ansible.builtin.file:
    path: "{{ services_dir }}/mosquitto/config/device-listener/8884.conf"
    state: absent
  when: device_ca_files.results | selectattr('stat.exists') | list | length != 2
  notify: Restart mosquitto

- name: Device CA reload stamp
  ansible.builtin.copy:
    dest: "{{ services_dir }}/mosquitto/data/.device-ca.sha1"
    content: |
      {% for item in device_ca_files.results %}
      {{ item.item }} {{ item.stat.checksum | default('absent') }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  notify: Reload mosquitto

# mosquitto_passwd salts every hash, so it can't be re-run on each play
# without "changing" everything. A login is added when it is missing; to
# change a password, edit the vault and run with -e reset_mqtt_passwords=true
# (all logins are recreated and clients must reconnect).
- name: Reset the logins file
  ansible.builtin.file:
    path: "{{ services_dir }}/mosquitto/data/auth/passwd"
    state: absent
  when: reset_mqtt_passwords | default(false) | bool
  notify: Reload mosquitto

- name: Logins file exists
  ansible.builtin.copy:
    content: ""
    dest: "{{ services_dir }}/mosquitto/data/auth/passwd"
    force: false
    owner: "1883"
    group: "1883"
    mode: "0600"

- name: Which logins exist
  ansible.builtin.command:
    argv: [cut, "-d:", -f1, "{{ services_dir }}/mosquitto/data/auth/passwd"]
  register: mqtt_have
  changed_when: false
  check_mode: false

# Pulled by itself, so a failed download is a clear error and a retry here,
# not a puzzling failure of the first login.
- name: Is the image that hashes the passwords here
  ansible.builtin.command: docker image inspect {{ mosquitto_image }}
  register: mqtt_image
  changed_when: false
  failed_when: false
  check_mode: false

- name: Pull the image that hashes the passwords
  ansible.builtin.command: docker pull -q {{ mosquitto_image }}
  register: mqtt_pull
  until: mqtt_pull.rc == 0
  retries: 3
  delay: 10
  changed_when: true
  when: mqtt_image.rc != 0 and not ansible_check_mode

- name: Add missing logins
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - none
      - -v
      - "{{ services_dir }}/mosquitto/data/auth:/mosquitto/auth"
      - --user
      - "1883"
      - "{{ mosquitto_image }}"
      - mosquitto_passwd
      - -b
      - /mosquitto/auth/passwd
      - "{{ item.key }}"
      - "{{ item.value }}"
  loop: "{{ vault_mosquitto_users | dict2items }}"
  loop_control: { label: "{{ item.key }}" }
  when: item.key not in mqtt_have.stdout_lines
  no_log: true
  changed_when: true
  notify: Reload mosquitto

- name: Plain-text copies of the logins (for you)
  ansible.builtin.copy:
    dest: "{{ services_dir }}/mosquitto/data/credentials.txt"
    content: |
      {% for user, password in vault_mosquitto_users.items() %}
      {{ user }} {{ password }}
      {% endfor %}
    owner: root
    group: root
    mode: "0600"
  no_log: true

# Mosquitto's own copy of the certificate: cert-sync.
- name: Cert-sync script
  ansible.builtin.copy:
    src: "{{ services_dir }}/mosquitto/cert-sync/rmx-mqtt-cert-sync.sh"
    remote_src: true
    dest: /usr/local/sbin/rmx-mqtt-cert-sync
    mode: "0755"

- name: Cert-sync units
  ansible.builtin.copy:
    src: "{{ services_dir }}/mosquitto/cert-sync/{{ item }}"
    remote_src: true
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop: [rmx-mqtt-cert-sync.service, rmx-mqtt-cert-sync.timer]
  register: cert_sync_units

- name: Systemd reads the new units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: cert_sync_units.changed

- name: Cert-sync twice a day and after boot
  ansible.builtin.systemd_service:
    name: rmx-mqtt-cert-sync.timer
    state: started
    enabled: true
