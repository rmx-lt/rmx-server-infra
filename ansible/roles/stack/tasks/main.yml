# The Docker Compose stack in services/ (Caddy, Mosquitto, the probe), its
# server-only files written from the vault, and the host helpers it needs.

- name: Repo
  ansible.builtin.import_tasks: repo.yml

- name: Caddy files
  ansible.builtin.import_tasks: caddy.yml

- name: Mosquitto files
  ansible.builtin.import_tasks: mosquitto.yml

- name: Probe files
  ansible.builtin.import_tasks: probe.yml

# Caddy first: it fetches the certificate Mosquitto needs to start.
- name: Start Caddy
  ansible.builtin.command: docker compose up -d caddy
  args: { chdir: "{{ services_dir }}" }
  register: caddy_up
  changed_when: caddy_up.stderr is search('Created|Recreated|Started')
  when: not ansible_check_mode

- name: Certificate for Mosquitto
  ansible.builtin.import_tasks: mqtt-cert.yml

- name: Start the rest of the stack
  ansible.builtin.command: docker compose up -d
  args: { chdir: "{{ services_dir }}" }
  register: compose_up
  changed_when: compose_up.stderr is search('Created|Recreated|Started')
  when: not ansible_check_mode

# `docker compose up -d` does not enable the probe profile, so it never
# recreates a running probe-app when probe/compose.yaml changes (issue 75).
# Touch only that container, and only when it is already running. PROBE_TAG
# stays the line in probe/.env. The 90 s health wait matches rmx-deploy-probe.
- name: Is probe-app running
  ansible.builtin.command: docker compose --profile probe ps -q --status running probe-app
  args: { chdir: "{{ services_dir }}" }
  register: probe_app_running
  changed_when: false
  when: not ansible_check_mode

- name: Recreate probe-app when its compose definition changed
  ansible.builtin.command: docker compose --profile probe up -d --no-deps probe-app
  args: { chdir: "{{ services_dir }}" }
  register: probe_app_recreate
  changed_when: probe_app_recreate.stderr is search('Recreated')
  when:
    - not ansible_check_mode
    - (probe_app_running.stdout | default('')) | length > 0

- name: Wait until the recreated probe-app is healthy
  ansible.builtin.command: docker compose --profile probe ps --format '{{ '{{' }}.Health{{ '}}' }}' probe-app
  args: { chdir: "{{ services_dir }}" }
  register: probe_app_health
  until: probe_app_health.stdout == 'healthy'
  retries: 30
  delay: 3
  changed_when: false
  when:
    - not ansible_check_mode
    - probe_app_recreate is changed

# Docker's restart policy alone left Mosquitto down after a reboot (#37).
- name: Boot unit that starts the stack
  ansible.builtin.copy:
    src: "{{ services_dir }}/rmx-stack.service"
    remote_src: true
    dest: /etc/systemd/system/rmx-stack.service
    mode: "0644"
  register: stack_unit

- name: Start the stack after every boot
  ansible.builtin.systemd_service:
    name: rmx-stack.service
    enabled: true
    daemon_reload: "{{ stack_unit.changed }}"
  # In --check the unit isn't written yet, so systemd can't find it (#43).
  when: not (ansible_check_mode and stack_unit.changed)

- name: Probe on, with its app logins (-e probe=on)
  ansible.builtin.import_tasks: probe-on.yml
  when: probe == "on" and not ansible_check_mode

- name: Apply config changes before the checks
  ansible.builtin.meta: flush_handlers

- name: Smoke test
  ansible.builtin.import_tasks: smoke-test.yml
  when: not ansible_check_mode
  tags: smoke
