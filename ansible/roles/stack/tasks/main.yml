# The Docker Compose stack in services/ (Caddy, Mosquitto, the app and its database), its
# server-only files written from the vault, and the host helpers it needs.

- name: Repo
  ansible.builtin.import_tasks: repo.yml

- name: Caddy files
  ansible.builtin.import_tasks: caddy.yml

- name: Mosquitto files
  ansible.builtin.import_tasks: mosquitto.yml

- name: App files
  ansible.builtin.import_tasks: app.yml

- name: Remove the old probe
  ansible.builtin.import_tasks: probe-cleanup.yml

# Caddy first: it fetches the certificate Mosquitto needs to start.
- name: Start Caddy
  ansible.builtin.command: docker compose up -d caddy
  args: { chdir: "{{ services_dir }}" }
  register: caddy_up
  changed_when: caddy_up.stderr is search('Created|Recreated|Started')
  when: not ansible_check_mode

# The Caddyfile is a single-file bind mount and rmx-ci updates the repo with
# git, which replaces the file: the running container keeps reading the old
# one, and `caddy reload` reloads that old file too (issue 93). Compare what
# the container sees with the repo's file and restart when they differ, after
# validating the new file in a throwaway container.
- name: Caddyfile the running Caddy reads
  ansible.builtin.command: docker compose exec -T caddy sha256sum /etc/caddy/Caddyfile
  args: { chdir: "{{ services_dir }}" }
  register: caddyfile_loaded
  changed_when: false
  failed_when: false
  check_mode: false

- name: Caddyfile in the repo
  ansible.builtin.stat:
    path: "{{ services_dir }}/caddy/Caddyfile"
    checksum_algorithm: sha256
  register: caddyfile_repo

- name: Caddy runs a stale Caddyfile
  ansible.builtin.set_fact:
    caddyfile_stale: >-
      {{ caddyfile_loaded.rc == 0 and caddyfile_repo.stat.exists
         and caddyfile_loaded.stdout.split()[0] != caddyfile_repo.stat.checksum }}

- name: Validate the new Caddyfile
  ansible.builtin.command: >
    docker compose run --rm --no-deps -T caddy
    caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  args: { chdir: "{{ services_dir }}" }
  changed_when: false
  when: caddyfile_stale | bool and not ansible_check_mode

- name: Restart Caddy on the new Caddyfile
  ansible.builtin.command: docker compose restart caddy
  args: { chdir: "{{ services_dir }}" }
  changed_when: true
  when: caddyfile_stale | bool and not ansible_check_mode

- name: Certificate for Mosquitto
  ansible.builtin.import_tasks: mqtt-cert.yml

- name: Start the rest of the stack
  ansible.builtin.command: docker compose up -d
  args: { chdir: "{{ services_dir }}" }
  register: compose_up
  changed_when: compose_up.stderr is search('Created|Recreated|Started')
  when: not ansible_check_mode

# The app is part of the stack (no profile), so `up -d` above also creates
# it and recreates it when app/compose.yaml changes. APP_TAG stays the line
# in app/.env. The wait matches rmx-deploy-app (a fresh database needs its
# migrations first).
- name: Wait until app is healthy
  ansible.builtin.command: docker compose ps --format '{{ '{{' }}.Health{{ '}}' }}' app
  args: { chdir: "{{ services_dir }}" }
  register: app_health
  until: app_health.stdout == 'healthy'
  retries: 40
  delay: 5
  changed_when: false
  when: not ansible_check_mode

# The password goes in on stdin, never on a command line. A login that
# exists already makes the command fail; that is fine.
- name: App logins
  ansible.builtin.command:
    argv: [docker, compose, exec, -T, app, /app/rmx-server, create-user, "{{ item.key }}"]
    stdin: "{{ item.value }}"
    chdir: "{{ services_dir }}"
  loop: "{{ vault_app_users | dict2items }}"
  loop_control: { label: "{{ item.key }}" }
  register: app_user
  failed_when: false
  changed_when: app_user.rc == 0
  no_log: true
  when: not ansible_check_mode

# Docker's restart policy alone left Mosquitto down after a reboot (#37).
- name: Boot unit that starts the stack
  ansible.builtin.copy:
    src: "{{ services_dir }}/rmx-stack.service"
    remote_src: true
    dest: /etc/systemd/system/rmx-stack.service
    mode: "0644"
  register: stack_unit

- name: Start the stack after every boot
  ansible.builtin.systemd_service:
    name: rmx-stack.service
    enabled: true
    daemon_reload: "{{ stack_unit.changed }}"
  # In --check the unit isn't written yet, so systemd can't find it (#43).
  when: not (ansible_check_mode and stack_unit.changed)

- name: Apply config changes before the checks
  ansible.builtin.meta: flush_handlers

- name: Smoke test
  ansible.builtin.import_tasks: smoke-test.yml
  when: not ansible_check_mode
  tags: smoke
