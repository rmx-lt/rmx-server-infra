# This repo at /opt/rmx-vps, owned by the admin user (bootstrap.sh cloned it).
# Runtime data and secrets inside it (services/*/data, caddy/private) stay
# owned by root or the service; they are gitignored.

- name: Clone the repo (when run from another machine)
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ repo_dir }}"
    version: "{{ repo_branch }}"
    update: false
  become: true
  become_user: "{{ admin_user }}"
  when: target | default('local') == 'remote'

- name: Repo files owned by the admin user
  ansible.builtin.command: >
    find {{ repo_dir }}
    \( -path '{{ services_dir }}/*/data' -o -path '{{ services_dir }}/caddy/private' \) -prune
    -o ! -user {{ admin_user }} -print -exec chown -h {{ admin_user }}:{{ admin_user }} {} +
  register: repo_chown
  changed_when: repo_chown.stdout != ''

- name: Root may run git in the admin user's repo
  ansible.builtin.copy:
    dest: /etc/gitconfig
    content: |
      [safe]
          directory = {{ repo_dir }}
    mode: "0644"

# The docs moved to the wiki (2026-10-31); remove the old README symlink.
- name: ~/VPS-SETUP.md is gone
  ansible.builtin.file:
    path: "{{ item }}/VPS-SETUP.md"
    state: absent
  loop: [/root, "/home/{{ admin_user }}"]

# Fetch over HTTPS: the repo is public, so no key is needed. The clone is
# read-only; changes reach the server only through a PR and the deploy.
- name: Fetch over HTTPS
  ansible.builtin.command: git -C {{ repo_dir }} config --local remote.origin.url {{ repo_url }}
  args:
    removes: "{{ repo_dir }}/.git"  # only in a clone (the container test copies the files)
  become: true
  become_user: "{{ admin_user }}"
  changed_when: false

# The server could push with a deploy key until 2026-11 (rmx-server-infra#96);
# remove the key, its ssh alias and the push settings.
- name: Old GitHub push key and its ssh alias are gone
  ansible.builtin.file:
    path: /home/{{ admin_user }}/.ssh/{{ item }}
    state: absent
  loop: [github-rmx-vps, github-rmx-vps.pub, config]

- name: GitHub's host key is gone (only the push key used it)
  ansible.builtin.known_hosts:
    path: /home/{{ admin_user }}/.ssh/known_hosts
    name: github.com
    state: absent
  become: true
  become_user: "{{ admin_user }}"

- name: No push URL or commit identity in the clone
  ansible.builtin.command: git -C {{ repo_dir }} config --local --unset-all {{ item }}
  loop: [remote.origin.pushurl, user.name, user.email]
  args:
    removes: "{{ repo_dir }}/.git"  # only in a clone
  register: git_unset
  changed_when: git_unset.rc == 0
  failed_when: git_unset.rc not in [0, 5]  # 5: was not set
  become: true
  become_user: "{{ admin_user }}"
