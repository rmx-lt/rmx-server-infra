# The app's server-only files, its firmware folders and the deploy
# script (wiki Server-Infra §10 "App"). The containers start with the rest of the
# stack (main.yml).

# On the first deploy, --check can't preview steps that write into files and
# folders this role creates (they don't exist yet in check mode). Remember
# whether they existed before, and skip those steps in check mode if not.
- name: App folder before this run
  ansible.builtin.stat:
    path: "{{ services_dir }}/app/data"
  register: app_data_before

- name: App env file before this run
  ansible.builtin.stat:
    path: "{{ services_dir }}/app/.env"
  register: app_env_before

- name: App data folder
  ansible.builtin.file:
    path: "{{ services_dir }}/app/data"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The firmware images, one folder per board (FIRMWARE_DIR/gateway and
# FIRMWARE_DIR/autopilot). The app serves them over MQTT, read-only.
- name: App firmware folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  loop:
    - "{{ services_dir }}/app/firmware"
    - "{{ services_dir }}/app/firmware/gateway"
    - "{{ services_dir }}/app/firmware/autopilot"

# The app keeps job paths in its database and no longer reads app/jobs.
# Removes the folder and anything in it (it was empty or hand-placed files the
# app ignores); a no-op once gone.
- name: Remove the unused app job folder
  ansible.builtin.file:
    path: "{{ services_dir }}/app/jobs"
    state: absent

# The app is uid 65532 and is not in the admin group. The folders stay 0755
# (other can traverse). An scp upload can be owner-only; make the files
# world-readable.
- name: Firmware images
  ansible.builtin.find:
    paths:
      - "{{ services_dir }}/app/firmware"
    file_type: file
    recurse: true
    follow: false
  register: app_served_files
  when: not ansible_check_mode or app_data_before.stat.exists

- name: Firmware images readable by the app
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0644"
  loop: "{{ app_served_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"

# Created on the first run (image tag `production`, see the template); later runs
# only keep the passwords in line. The NTRIP_* lines are set by hand and never
# touched. APP_TAG belongs to the deploy script.
- name: App env file
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ services_dir }}/app/.env"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
    force: false
  no_log: true

- name: Passwords in app/.env
  ansible.builtin.lineinfile:
    path: "{{ services_dir }}/app/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: APP_DB_PASSWORD, value: "{{ vault_app_db_password }}" }
    - { key: APP_MQTT_PASSWORD, value: "{{ vault_mosquitto_users['app'] }}" }
  loop_control: { label: "{{ item.key }}" }
  no_log: true
  when: not ansible_check_mode or app_env_before.stat.exists

- name: Plain-text copies of the app logins (for you)
  ansible.builtin.copy:
    dest: "{{ services_dir }}/app/data/credentials.txt"
    content: |
      db-password {{ vault_app_db_password }}
      {% for user, password in vault_app_users.items() %}
      app-login {{ user }} {{ password }}
      {% endfor %}
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not ansible_check_mode or app_data_before.stat.exists

- name: Deploy script
  ansible.builtin.copy:
    src: "{{ services_dir }}/app/deploy/rmx-deploy-app.sh"
    remote_src: true
    dest: /usr/local/sbin/rmx-deploy-app
    owner: root
    group: root
    mode: "0755"

- name: Deploy log
  ansible.builtin.file:
    path: /var/log/rmx-deploy-app.log
    state: touch
    owner: root
    group: adm
    mode: "0640"
    modification_time: preserve
    access_time: preserve
