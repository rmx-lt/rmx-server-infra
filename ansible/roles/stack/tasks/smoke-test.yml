# The server answers: sites over HTTPS (through localhost, so DNS doesn't
# matter) and MQTT's TLS port.

- name: Sites answer over HTTPS
  ansible.builtin.command: >
    curl -sS --noproxy '*' -o /dev/null -w '%{http_code}'
    --resolve {{ item.host }}:443:127.0.0.1 https://{{ item.host }}{{ item.path }}
  register: smoke_http
  until: smoke_http.stdout == item.expect
  retries: 12
  delay: 5
  changed_when: false
  failed_when: smoke_http.stdout != item.expect
  loop:
    - { host: rmx.lt, path: /, expect: "200" }
    - { host: api.rmx.lt, path: /, expect: "200" }
    - { host: www.rmx.lt, path: /, expect: "301" }
  loop_control: { label: "{{ item.host }}{{ item.path }} -> {{ item.expect }}" }

- name: MQTT port 8883 does a TLS handshake
  ansible.builtin.shell: >
    echo | openssl s_client -connect 127.0.0.1:8883 -servername {{ mqtt_domain }}
    -verify_return_error -brief 2>&1 | grep -q 'Verification: OK'
  register: smoke_mqtt
  until: smoke_mqtt.rc == 0
  retries: 6
  delay: 5
  changed_when: false

# Check the body, not only the status: a stale Caddy config answered /app/health
# with its 200 placeholder (issue 93).
- name: App health
  ansible.builtin.command: >
    curl -fsS --noproxy '*' --resolve api.rmx.lt:443:127.0.0.1 https://api.rmx.lt/app/health
  register: smoke_app
  until: smoke_app.stdout is search('"status":"ok"')
  retries: 12
  delay: 5
  changed_when: false
  failed_when: smoke_app.stdout is not search('"status":"ok"')
