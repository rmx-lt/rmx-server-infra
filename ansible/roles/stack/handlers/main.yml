# Both only act when the container is running; compose up starts it otherwise.
- name: Restart caddy
  ansible.builtin.shell: |
    if [ -n "$(docker compose ps -q --status running caddy)" ]; then
      docker compose restart caddy
    fi
  args: { chdir: "{{ services_dir }}" }
  changed_when: true

# SIGHUP reloads logins, ACL and certificate without dropping clients.
- name: Reload mosquitto
  ansible.builtin.shell: |
    if [ -n "$(docker compose ps -q --status running mosquitto)" ]; then
      docker compose kill -s HUP mosquitto
    fi
  changed_when: true
