# Checks the playbook: syntax, ansible-lint, vault encrypted, a database backup/restore round trip,
# and the whole server built from empty in a container.
# Runs on PRs to development (the gate before merge) and on pushes to development (tests the merge
# commit, so the development tip has results). The development -> production PR's head is that tip,
# so its required checks (`check`, `db-roundtrip`, `container`) are already green: no run of its own.
# No path filters, or a tip could lack results and block the production PR.
name: ci

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

# A newer commit on the same PR or a newer development push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: The vault, if present, is encrypted
        run: |
          f=ansible/group_vars/all/vault.yml
          if [ -f "$f" ] && ! head -1 "$f" | grep -q '^\$ANSIBLE_VAULT;'; then
            echo "::error file=$f::vault.yml is not encrypted (run: ansible-vault encrypt $f)"
            exit 1
          fi

      - name: Install ansible-core and ansible-lint
        run: pipx install ansible-core==2.16.* && pipx install ansible-lint && pipx inject ansible-lint ansible-core==2.16.* --force

      - name: Syntax and lint
        working-directory: ansible
        run: |
          ansible-playbook --syntax-check site.yml
          ansible-lint site.yml

  # Backup and restore of the database and Mosquitto's store, against a throwaway TimescaleDB.
  db-roundtrip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo ansible/test/db-roundtrip.sh

  # The whole server from empty in a container; a second run must change nothing.
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: echo "MONTH=$(date +%Y-%m)" >>"$GITHUB_ENV"
      # The base image (OS + apt packages) from the Actions cache, rebuilt monthly for new packages;
      # the playbook still builds the server from empty.
      - id: base
        uses: actions/cache@v6
        with:
          path: /tmp/base.tar
          key: container-base-${{ hashFiles('ansible/test/base.Dockerfile') }}-${{ env.MONTH }}
      - if: steps.base.outputs.cache-hit == 'true'
        run: docker load -q -i /tmp/base.tar
      - if: steps.base.outputs.cache-hit != 'true'
        run: |
          docker build -q -t rmx-test-base -f ansible/test/base.Dockerfile ansible/test
          docker save -o /tmp/base.tar rmx-test-base
      - run: ansible/test/container-test.sh
        env:
          BASE_IMAGE: rmx-test-base
