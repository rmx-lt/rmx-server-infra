# Adds every new issue to the org project Blade of Grass
# (https://github.com/orgs/rmx-lt/projects/1). The project's own auto-add
# workflow covers only one repo on our plan, so each repo has this file.
# Status, Priority and Area are still set by hand. Needs the org secret
# PROJECT_PAT (token with Projects read/write on rmx-lt). rmx-lt/blade-of-grass#8
name: add-to-project

on:
  issues:
    types: [opened, reopened, transferred]

permissions: {}

jobs:
  add:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/rmx-lt/projects/1
          github-token: ${{ secrets.PROJECT_PAT }}
