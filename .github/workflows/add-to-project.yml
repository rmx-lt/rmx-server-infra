name: Add to project

on:
  issues:
    types: [opened, transferred]

jobs:
  add-to-project:
    name: Add issue to the Blade of Grass project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/rmx-lt/projects/1
          github-token: ${{ secrets.PROJECT_PAT }}
